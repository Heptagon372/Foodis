# foodis.cloud — Nginx 리버스 프록시 설정
# 설치 위치: /etc/nginx/sites-available/foodis
# 활성화:   ln -sf /etc/nginx/sites-available/foodis /etc/nginx/sites-enabled/foodis
# SSL은 `sudo certbot --nginx -d foodis.cloud -d www.foodis.cloud` 가 아래 server 블록을
# 자동으로 복제·수정해서 443 리스너를 추가해 줌. 수동 수정 X.

# HTTP → 그대로 통과시킨다 (certbot가 443으로 redirect 블록을 자동 추가)
server {
    listen 80;
    listen [::]:80;
    server_name foodis.cloud www.foodis.cloud;

    # 로그
    access_log /var/log/nginx/foodis.access.log;
    error_log  /var/log/nginx/foodis.error.log;

    # 업로드 상한 (음성·이미지 포함)
    client_max_body_size 20m;

    # Next.js dev HMR과 WebSocket 호환 (서비스에 ws 쓸 때)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # 실제 IP·프로토콜 전달
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Next.js 정적 자산 캐시 (해시 들어가는 /_next/static 은 길게)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # /public 아래 정적 파일도 Next가 서빙 — 캐시만 짧게
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|avif|woff2?)$ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=86400";
    }

    # 그 외 전부 Next.js 로
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
